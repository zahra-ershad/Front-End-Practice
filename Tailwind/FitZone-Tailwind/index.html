<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/output.css">
    <link rel="shortcut icon" href="./assets/img/logo.svg" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;900&display=swap" rel="stylesheet">
    <title>FitZone</title>
</head>

<body class="font-medium">
                                    <!-- navbar-div -->
    <header class="z-20 flex items-center w-screen  justify-between fixed top-0 left-0 px-6 py-3 md:py-4 shadow  rounded-[2rem] mx-auto  bg-white 2xl:justify-around 2xl:gap-[.53rem]">
        <a  class="flex justify-end gap-2 ">
            <img src="./assets/img/logo.svg" class="w-[3.5rem] h-[3.5rem] object-cover" fill="#f97316" />
                <h5 class=" font-black text-[1.5rem] mt-[.5rem] text-orange-500 flex ">
                    Fit
                    <p class="text-black">
                        Zone
                    </p>
                </h5>
        </a>
        <nav id="menu" class="max-md:absolute max-md:top-0 max-md:left-0 max-md:overflow-hidden items-center justify-center max-md:h-full max-md:w-0 transition-[width] bg-white/50 backdrop-blur flex-col md:flex-row flex gap-8 text-gray-900 text-sm font-normal">
            <a class="hover:text-orange-500" href="#">
                Home 
            </a>
            <a class="hover:text-orange-500" href="#">
                Trainers 
            </a>
            <a class="hover:text-orange-500" href="#">
                Pricing
            </a>
            <a class="hover:text-orange-500" href="#">
                Classes 
            </a>
            <a class="hover:text-orange-500" href="#">
                Contact
            </a>
            <button id="closeMenu" class="md:hidden text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </nav>
        <div class="flex items-center space-x-4">
           
            <a class="hidden md:flex bg-orange-600 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-orange-200 transition" href="#">
                Join Now
            </a>
            <button id="openMenu" class="md:hidden text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>
    
   


        <!-- hero-section -->
    <div style="background-image:url(./assets/img/hero.webp)" 
        class=" w-full  bg-cover md:bg-top mt-[5.5rem] relative h-[27rem]
         sm:h-[28rem] md:h-[34rem]">

        <!-- before-overlay -->
         <div class="absolute top-0 left-0 w-full h-full inset-0 z-10 bg-[#f79450a6]">

            <!-- texts-div -->
             <div class="p-[1rem] flex flex-col justify-center items-center text-center gap-2
             md:justify-start md:text-left md:items-start md:gap-[.8rem]">

                <!-- bold-matto -->
                <div class="p-[.5rem] font-black text-[2rem] font-[700]
                md:text-[4.5rem] lg:text-[5.4rem]">
                    Transform Your Body, Transform Your Life
                </div>

                <!-- mid-text -->
                <div class="p-[.5rem] text-[1rem] md:w-[45rem]
                md:text-[1.2rem] ">
                    Join the best gym in town with expert trainers, state-of-the-art equipment, and a community that pushes you to be your best.
                </div>

                <!-- buttons -->
                <div class="p-[.5rem] mt-2 flex gap-2 justify-center items-center text-[.7rem] 
                md:text-[1rem] ">

                    <button class="p-[1rem] rounded-xl bg-[#f97316] hover:bg-[#cd712f]  text-white">
                        Start Your Free Trial
                    </button>

                    <button class="p-[1rem] rounded-xl bg-white text-[#f97316]">
                        Learn More
                    </button>
                </div>
             </div>

         </div>
    </div>



    <div class="div-2"></div>



    <div class="div-3"></div>



    <div class="div-4"></div>



    <div class="div-5"></div>



    <div class="div-6"></div>



</body>
<script>
    const openMenu = document.getElementById('openMenu');
    const closeMenu = document.getElementById('closeMenu');
    const menu = document.getElementById('menu');

    openMenu.addEventListener('click', () => {
        menu.classList.remove('max-md:w-0');
        menu.classList.add('max-md:w-full');
    });

    closeMenu.addEventListener('click', () => {
        menu.classList.remove('max-md:w-full');
        menu.classList.add('max-md:w-0');
    });
</script>
</html>
